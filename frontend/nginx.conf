# Nginx configurado para React Router SPA
server {
    listen 80;

    # Diretório com os arquivos estáticos
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 200M;

    # Redireciona todas as rotas para index.html (necessário para React Router)
    location / {
        try_files $uri /index.html;
    }

    # Cache básico para arquivos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Tratamento básico de erros
    error_page 404 /index.html;
}
